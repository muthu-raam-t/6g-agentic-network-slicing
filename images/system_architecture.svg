<svg viewBox="0 0 1500 2150" xmlns="http://www.w3.org/2000/svg" font-family="Courier New, monospace">
  <rect width="1500" height="2150" fill="white"/>

  <!-- Title -->
  <rect x="90" y="40" width="1320" height="110" fill="white" stroke="black" stroke-width="3"/>
  <text x="750" y="90" text-anchor="middle" font-size="30" font-weight="bold">PROPOSED SYSTEM ARCHITECTURE</text>
  <text x="750" y="125" text-anchor="middle" font-size="18">Agentic, Twin-Driven Proactive QoS Assurance for 6G Network Slicing</text>

  <!-- Stage 1 -->
  <rect x="90" y="180" width="1320" height="130" fill="white" stroke="black" stroke-width="2"/>
  <text x="750" y="215" text-anchor="middle" font-size="22" font-weight="bold">1. ENHANCED DIGITAL TWIN</text>
  <text x="750" y="248" text-anchor="middle" font-size="16">Congestion Cliff: QueuingDelay ~ (Load/Capacity)^(11/5)</text>
  <text x="750" y="272" text-anchor="middle" font-size="16">Stateful Channel Fading (correlated, not random) + Shared Base-Station Contention</text>
  <text x="750" y="296" text-anchor="middle" font-size="16">Output: realistic per-slice traffic and latency signal every timestep</text>

  <line x1="750" y1="310" x2="750" y2="340" stroke="black" stroke-width="2"/>
  <polygon points="742,340 758,340 750,352" fill="black"/>

  <!-- Stage 2 -->
  <rect x="90" y="360" width="1320" height="130" fill="white" stroke="black" stroke-width="2"/>
  <text x="750" y="395" text-anchor="middle" font-size="22" font-weight="bold">2. PROBABILISTIC FORECASTER (LSTM)</text>
  <text x="750" y="428" text-anchor="middle" font-size="16">Input: last 30 timesteps of traffic per slice</text>
  <text x="750" y="452" text-anchor="middle" font-size="16">Output: mean + variance forecast (risk-aware, not single-point)</text>
  <text x="750" y="476" text-anchor="middle" font-size="16">Trained on synthetic traffic generated by Stage 1</text>

  <line x1="750" y1="490" x2="750" y2="520" stroke="black" stroke-width="2"/>
  <polygon points="742,520 758,520 750,532" fill="black"/>

  <!-- Stage 3 -->
  <rect x="90" y="540" width="1320" height="140" fill="white" stroke="black" stroke-width="2"/>
  <text x="750" y="575" text-anchor="middle" font-size="22" font-weight="bold">3. LIVE AGENTIC PLANNER (LLM)</text>
  <text x="750" y="608" text-anchor="middle" font-size="16">Prompt: current state + forecast + uncertainty + hard network rules</text>
  <text x="750" y="632" text-anchor="middle" font-size="16">Output: structured JSON allocation plan, in inspectable natural language</text>
  <text x="750" y="656" text-anchor="middle" font-size="16">Replaces the earlier PPO/RL agent entirely</text>

  <!-- Branch to 3A/3B -->
  <line x1="750" y1="680" x2="750" y2="710" stroke="black" stroke-width="2"/>
  <line x1="380" y1="710" x2="1120" y2="710" stroke="black" stroke-width="2"/>
  <line x1="380" y1="710" x2="380" y2="740" stroke="black" stroke-width="2"/>
  <line x1="1120" y1="710" x2="1120" y2="740" stroke="black" stroke-width="2"/>
  <polygon points="372,740 388,740 380,752" fill="black"/>
  <polygon points="1112,740 1128,740 1120,752" fill="black"/>

  <!-- 3A / 3B -->
  <rect x="90" y="760" width="620" height="150" fill="white" stroke="black" stroke-width="2"/>
  <text x="400" y="795" text-anchor="middle" font-size="19" font-weight="bold">3A. STATIC BASELINE</text>
  <text x="400" y="825" text-anchor="middle" font-size="15">(control arm)</text>
  <text x="400" y="850" text-anchor="middle" font-size="15">Fixed bandwidth split,</text>
  <text x="400" y="874" text-anchor="middle" font-size="15">never adapts to traffic</text>
  <text x="400" y="898" text-anchor="middle" font-size="15">Legacy: old PPO/RL agent run here too</text>

  <rect x="790" y="760" width="620" height="150" fill="white" stroke="black" stroke-width="2"/>
  <text x="1100" y="795" text-anchor="middle" font-size="19" font-weight="bold">3B. LIVE AGENTIC SYSTEM</text>
  <text x="1100" y="825" text-anchor="middle" font-size="15">(this project's core contribution)</text>
  <text x="1100" y="850" text-anchor="middle" font-size="15">Proactive, forecast-driven,</text>
  <text x="1100" y="874" text-anchor="middle" font-size="15">explainable reallocation</text>
  <text x="1100" y="898" text-anchor="middle" font-size="15">every control cycle</text>

  <line x1="400" y1="910" x2="400" y2="940" stroke="black" stroke-width="2"/>
  <polygon points="392,940 408,940 400,952" fill="black"/>
  <line x1="1100" y1="910" x2="1100" y2="940" stroke="black" stroke-width="2"/>
  <polygon points="1092,940 1108,940 1100,952" fill="black"/>

  <!-- Stage 4: Safety Layer -->
  <rect x="790" y="960" width="620" height="170" fill="white" stroke="black" stroke-width="2"/>
  <text x="1100" y="995" text-anchor="middle" font-size="19" font-weight="bold">4. SAFETY LAYER</text>
  <text x="1100" y="1025" text-anchor="middle" font-size="15">Syntax check -&gt; Semantic/constraint check</text>
  <text x="1100" y="1050" text-anchor="middle" font-size="15">Fail: retry with error feedback (bounded, novel)</text>
  <text x="1100" y="1075" text-anchor="middle" font-size="15">Still fails: fall back to deterministic safe policy</text>
  <text x="1100" y="1100" text-anchor="middle" font-size="14" font-style="italic">Self-correcting retry loop - add-on over base paper</text>

  <!-- retry loop arrow -->
  <path d="M 1410 1000 C 1470 1000, 1470 700, 1410 700" fill="none" stroke="black" stroke-width="2"/>
  <polygon points="1418,708 1418,692 1400,700" fill="black"/>
  <text x="1445" y="850" text-anchor="middle" font-size="13" transform="rotate(90 1445 850)">retry with feedback</text>

  <line x1="400" y1="952" x2="400" y2="1160" stroke="black" stroke-width="2"/>
  <line x1="1100" y1="1130" x2="1100" y2="1160" stroke="black" stroke-width="2"/>
  <line x1="400" y1="1160" x2="1100" y2="1160" stroke="black" stroke-width="2"/>
  <line x1="750" y1="1160" x2="750" y2="1180" stroke="black" stroke-width="2"/>
  <polygon points="742,1180 758,1180 750,1192" fill="black"/>

  <!-- Stage 5: Actuation + Logging -->
  <rect x="90" y="1200" width="1320" height="130" fill="white" stroke="black" stroke-width="2"/>
  <text x="750" y="1235" text-anchor="middle" font-size="22" font-weight="bold">5. ACTUATION + METRICS LOGGING</text>
  <text x="750" y="1268" text-anchor="middle" font-size="16">Verified plan applied to the Digital Twin for this timestep</text>
  <text x="750" y="1292" text-anchor="middle" font-size="16">Latency, throughput, QoS-violation flags logged per slice, per timestep</text>
  <text x="750" y="1316" text-anchor="middle" font-size="16">State fed back to Stage 1 for the next control cycle</text>

  <line x1="750" y1="1330" x2="750" y2="1360" stroke="black" stroke-width="2"/>
  <polygon points="742,1360 758,1360 750,1372" fill="black"/>

  <!-- Stage 6: Comparison + Validation -->
  <rect x="90" y="1380" width="1320" height="130" fill="white" stroke="black" stroke-width="2"/>
  <text x="750" y="1415" text-anchor="middle" font-size="22" font-weight="bold">6. COMPARISON &amp; VALIDATION</text>
  <text x="750" y="1448" text-anchor="middle" font-size="16">P99 tail latency, QoS violation rate, eMBB throughput trade-off</text>
  <text x="750" y="1472" text-anchor="middle" font-size="16">Static Baseline vs. Old RL Agent vs. Live Agentic System</text>
  <text x="750" y="1496" text-anchor="middle" font-size="16">Figures: latency time-series, CCDF, allocation-vs-demand, throughput impact</text>

  <line x1="750" y1="1510" x2="750" y2="1540" stroke="black" stroke-width="2"/>
  <line x1="400" y1="1540" x2="1100" y2="1540" stroke="black" stroke-width="2"/>
  <line x1="400" y1="1540" x2="400" y2="1570" stroke="black" stroke-width="2"/>
  <line x1="1100" y1="1540" x2="1100" y2="1570" stroke="black" stroke-width="2"/>
  <polygon points="392,1570 408,1570 400,1582" fill="black"/>
  <polygon points="1092,1570 1108,1570 1100,1582" fill="black"/>

  <!-- Accept / Underperform -->
  <rect x="90" y="1590" width="620" height="110" fill="white" stroke="black" stroke-width="2"/>
  <text x="400" y="1625" text-anchor="middle" font-size="19" font-weight="bold">RESULTS ACCEPTED</text>
  <text x="400" y="1655" text-anchor="middle" font-size="15">Agent outperforms baseline -&gt;</text>
  <text x="400" y="1678" text-anchor="middle" font-size="15">lock metrics, write up report</text>

  <rect x="790" y="1590" width="620" height="110" fill="white" stroke="black" stroke-width="2"/>
  <text x="1100" y="1625" text-anchor="middle" font-size="19" font-weight="bold">TUNE &amp; RE-RUN</text>
  <text x="1100" y="1655" text-anchor="middle" font-size="15">Below expected margin -&gt;</text>
  <text x="1100" y="1678" text-anchor="middle" font-size="15">adjust prompt/forecaster, re-run Stage 3-6</text>

  <line x1="750" y1="1700" x2="750" y2="1730" stroke="black" stroke-width="2"/>
  <polygon points="742,1730 758,1730 750,1742" fill="black"/>

  <!-- UI Dashboard layer -->
  <rect x="90" y="1750" width="1320" height="140" fill="white" stroke="black" stroke-width="3"/>
  <text x="750" y="1790" text-anchor="middle" font-size="22" font-weight="bold">7. UI DASHBOARD (SITS ON TOP OF THE WHOLE PIPELINE)</text>
  <text x="750" y="1823" text-anchor="middle" font-size="16">Live traffic / latency / allocation charts  +  Agent reasoning panel (LLM's plain-English explanation)</text>
  <text x="750" y="1847" text-anchor="middle" font-size="16">Manual fault-injection control (spike a cell, kill a cell) for live demo</text>
  <text x="750" y="1871" text-anchor="middle" font-size="16">Add-on over base paper: makes the whole pipeline demonstrable, not just a script</text>

  <!-- Key highlights -->
  <rect x="90" y="1910" width="1320" height="220" fill="white" stroke="black" stroke-width="3"/>
  <text x="750" y="1950" text-anchor="middle" font-size="22" font-weight="bold">KEY HIGHLIGHTS / NOVELTY OVER BASE PAPER</text>
  <text x="750" y="1985" text-anchor="middle" font-size="15">- Three-way comparison (Static / RL / LLM-Agent), not just two</text>
  <text x="750" y="2010" text-anchor="middle" font-size="15">- Self-correcting safety layer: bounded retry with error feedback before fallback</text>
  <text x="750" y="2035" text-anchor="middle" font-size="15">- Live UI dashboard with real-time agent reasoning panel</text>
  <text x="750" y="2060" text-anchor="middle" font-size="15">- Manual fault/spike injection for live, on-demand resilience demonstration</text>
  <text x="750" y="2085" text-anchor="middle" font-size="15">- Fully reproducible on a laptop; no dependency on paid/limited hardware</text>
</svg>
